n)[1],access=new URLSearchParams(location.search).get("access");document.body.innerHTML='<main class="client-workspace"><div class="shell" id="agreement-shell">Loading private agreement…</div></main>';if(!id||!access)return;const r=await fetch("/api/agreement?id="+encodeURIComponent(id)+"&access="+encodeURIComponent(access));if(!r.ok){document.getElementById("agreement-shell").textContent="Private agreement unavailable.";return}const d=await r.json(),a=d.agreement;document.getElementById("agreement-shell").innerHTML='<header><p>CHARMIN GREENE · PRIVATE AGREEMENT</p><h1>'+esc(a.title||"Service Agreement")+'</h1>'+(a.organization_name?'<span>Prepared for '+esc(a.organization_name)+'</span>':'')+'</header><section><small>TERMS · '+esc(a.terms_version||"")+'</small><h2>'+esc(a.terms_title||"Agreement Terms")+'</h2><div style="white-space:pre-wrap;line-height:1.7">'+esc(a.terms_body||"")+'</div></section><section><small>STATUS</small><h2>'+esc(String(a.status||"").replaceAll("_"," "))+'</h2>'+(a.status==="SIGNED"?'<p>Signature completed'+(a.signed_at?" · "+new Date(a.signed_at).toLocaleDateString():"")+'.</p>':a.signing_url?'<a class="action" href="'+esc(a.signing_url)+'" rel="noreferrer">Continue to secure signature →</a>':'<p>Your agreement is prepared. The secure signature request has not yet been released.</p>')+'</section>'}addEventListener("DOMContentLoaded",loadPrivateAgreement);async function loadPrivateProposal(){if(!location.pathname.startsWith("/proposal/"))return;const id=location.pathname.split("/").filter(Boolean)[1],access=new URLSearchParams(location.search).get("access");document.body.innerHTML='<main class="private-proposal"><div class="shell" id="proposal-shell"><p>Loading private engagement…</p></div></main>';if(!id||!access)return;const base="https://wgos.app";const r=await fetch("/api/proposal?id="+encodeURIComponent(id)+"&access="+encodeURIComponent(access));if(!r.ok){document.getElementById("proposal-shell").innerHTML="<h1>Private proposal unavailable.</h1>";return}const d=await r.json(),p=d.proposal,m=(v)=>new Intl.NumberFormat("en-US",{style:"currency",currency:p.currency||"USD"}).format(Number(v||0));document.getElementById("proposal-shell").innerHTML='<section class="intro"><p class="eyebrow">CHARMIN GREENE · PRIVATE ENGAGEMENT</p><h1>'+esc(p.opportunity_title||"A Bespoke Musical Experience")+'</h1><p>'+(p.organization_name?"Prepared exclusively for "+esc(p.organization_name):"Created exclusively for you")+'</p></section>'+d.sections.map(x=>'<section class="panel"><p class="eyebrow">'+esc(x.section_type)+'</p><h3>'+esc(x.title||x.section_type)+'</h3><p>'+esc(typeof x.content==="string"?x.content:JSON.stringify(x.content))+'</p></section>').join("")+'<section class="panel"><p class="eyebrow">ENGAGEMENT</p><h3>'+m(p.one_time_total)+'</h3>'+d.items.map(x=>'<div class="line"><span>'+esc(x.name)+'</span><strong>'+m((Number(x.unit_amount_cents)*Number(x.quantity)+Number(x.tax_cents))/100)+'</strong></div>').join("")+'</section><button id="brand-accept" class="action" onclick="acceptBrandProposal('"+id+"','"+access+"')">Accept Proposal →</button>'}function esc(v){const e=document.createElement("div");e.textContent=String(v||"");return e.innerHTML}addEventListener("DOMContentLoaded",loadPrivateProposal)</script><style></head><body><header class="top"><a class="brand" href="#home">CHARMIN GREENE</a><nav aria-label="Primary navigation"><a href="/featured-saxophonist">FEATURED ARTIST</a><a href="/horn-arranging">HORN ARRANGING</a><a href="/private-events">PRIVATE EVENTS</a><a href="/weddings">WEDDINGS</a><a href="/live-performances">CONCERTS</a><a href="#artist">THE ARTIST</a><a href="#experience">THE EXPERIENCE</a><a href="#music">MUSIC</a><a href="#duo">CHARMIN & JERMAINE</a><a class="nav-book" href="#booking">BOOK CHARMIN ↗</a></nav></header><main><section id="home" class="hero"><img src="assets/charmin-hero.jpeg" alt="Charmin Greene holding her saxophone in a dramatic black-and-gold portrait" fetchpriority="high"><div class="hero-copy"><div class="eyebrow">Saxophonist · Recording Artist · Live Experience</div><h1>A sound<br>that <em style="color:#d9b58a;font-weight:400">moves</em><br>people.</h1><p>Soulful. Expressive. Unforgettable. Charmin Greene brings artistry, elegance and an undeniable presence to every stage.</p><a class="cta" href="#experience">DISCOVER THE EXPERIENCE <span aria-hidden="true">↗</span></a></div><div class="hero-bottom">SCROLL TO DISCOVER ↓</div></section><section id="artist" class="section split"><div><span class="eyebrow kicker">THE ARTIST</span><h2>Artistry<br>without limits.</h2><p>Expressive musicianship. Effortless sophistication. A sound that moves between jazz, R&B, pop and gospel, bringing unmistakable character to every stage and occasion.</p><p>From intimate settings to major concert stages, Charmin Greene creates musical moments that stay with you long after the final note.</p><a class="cta" href="https://charmingreene.com/epk">VIEW THE ELECTRONIC PRESS KIT ↗</a></div><div class="image"><img loading="lazy" src="assets/charmin-standing.jpeg" alt="Charmin Greene in a black-and-white fashion ensemble against a warm wood backdrop" style="object-position:center 15%"></div></section><section id="experience" class="section dark"><span class="eyebrow" style="color:var(--bronze)">THE EXPERIENCE</span><h2 class="section-head">Exceptional<br>performances.</h2><div class="experiences"><article class="experience"><span>01 / PRIVATE</span><h3>Intimate & exceptional.</h3><p>Thoughtfully curated performances for private celebrations, luxury weddings and destination gatherings.</p></article><article class="experience"><span>02 / CORPORATE</span><h3>Make an impression.</h3><p>Live music for elevated receptions, corporate galas, hospitality experiences and milestone events.</p></article><article class="experience"><span>03 / LIVE</span><h3>Command the room.</h3><p>Concerts, festivals, curated cultural programming and headline performances for audiences who love live music.</p></article></div><a class="cta" href="#booking">REQUEST A PERFORMANCE ↗</a></section><section id="music" class="section editorial split"><div class="image"><img loading="lazy" src="assets/charmin-portrait.jpeg" alt="Charmin Greene with her saxophone, wearing an elegant white shirt"></div><div><span class="eyebrow kicker">MUSIC & PERFORMANCE</span><h2>Hear what<br>words cannot say.</h2><p>Discover Charmin's musical world, from soulful melodies and inspired improvisation to the electricity of her live performances.</p><p>Explore her electronic press kit for recordings, video, photography and booking information.</p><a class="cta" href="https://charmingreene.com/epk">EXPLORE THE EPK ↗</a></div></section><section id="duo" class="duo"><div class="photo"><img loading="lazy" src="assets/charmin-jermaine.jpeg" alt="Editorial portrait of Charmin and Jermaine together"></div><div class="copy"><span class="eyebrow" style="color:var(--bronze)">TWO ARTISTS. ONE EXPERIENCE.</span><h2>Charmin<br>& Jermaine.</h2><p>A signature musical partnership: two distinctive voices come together for a captivating blend of soul, jazz and R&B. Explore the duo for concerts, private engagements and elevated live experiences.</p><a class="cta" href="https://charminjermaine.com" target="_blank" rel="noopener">EXPLORE THE DUO ↗</a></div></section><section class="section"><span class="eyebrow kicker">AN EDITORIAL STUDY</span><h2>Presence is<br>everything.</h2><div class="gallery"><img loading="lazy" src="assets/charmin-standing.jpeg" alt="Full-length editorial portrait of Charmin Greene holding a saxophone"><img loading="lazy" src="assets/charmin-soprano.jpeg" alt="Charmin Greene with a soprano saxophone in a studio portrait"></div></section><section class="section editorial" id="services"><span class="eyebrow kicker">EXPLORE THE POSSIBILITIES</span><h2>Artistry for every stage.</h2><p class="lead">From featured performances and horn arrangements to exceptional private celebrations, discover the right experience for your event or production.</p><div class="seo-services"><a href="/featured-saxophonist"><span>FEATURED ARTIST</span><strong>Guest appearances & concert performances ↗</strong></a><a href="/horn-arranging"><span>HORN ARRANGING</span><strong>Arrangements for recordings & live shows ↗</strong></a><a href="/private-events"><span>PRIVATE ENGAGEMENTS</span><strong>Galas, VIP & international occasions ↗</strong></a><a href="/weddings"><span>WEDDINGS</span><strong>Celebrations in Houston & beyond ↗</strong></a><a href="/live-performances"><span>LIVE PERFORMANCES</span><strong>Concerts, festivals & corporate events ↗</strong></a></div></section><section id="booking" class="booking"><div class="booking-grid"><div><span class="eyebrow kicker">PRIVATE INQUIRIES & ENGAGEMENTS</span><h2>Let's create<br>something<br>memorable.</h2><p>Tell us about your event, desired performance and location. Share your event details to prepare a booking inquiry. This preview does not yet send information to management.</p></div><form class="form" id="inquiry"><div class="field"><label for="name">Your name *</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="type">Event type *</label><select id="type" name="type" required><option value="">Select an experience</option><option>Featured Artist / Guest Appearance</option><option>Horn Arranging / Recording</option><option>Private / Luxury Event</option><option>Wedding / Celebration</option><option>Corporate / Gala</option><option>Concert / Festival</option><option>Destination Event</option><option>Charmin & Jermaine</option><option>Other</option></select></div><div class="field"><label for="date">Event date</label><input id="date" name="date" type="date"></div><div class="field"><label for="location">Event city / venue</label><input id="location" name="location" placeholder="City, state or country"></div><div class="field"><label for="budget">Estimated entertainment budget</label><select id="budget" name="budget"><option value="">Prefer not to say</option><option>Under $3,000</option><option>$3,000–$5,000</option><option>$5,000–$10,000</option><option>$10,000–$20,000</option><option>$20,000+</option><option>To be discussed</option></select></div><div class="field wide"><label for="details">Tell us about your vision</label><textarea id="details" name="details" placeholder="Audience size, desired format, performance length and any special requests"></textarea></div><div class="field wide"><button class="submit" type="submit">PREPARE MY INQUIRY ↗</button><span class="form-note">Preview mode: copy your completed inquiry into an email or use the existing booking page. No personal information is sent from this prototype.</span><div class="form-status" id="status" aria-live="polite"></div><a href="https://charmingreene.com/book-now" style="font-size:12px">CONTINUE TO EXISTING BOOKING PAGE ↗</a></div></form></div></section></main><footer><div><a class="brand" href="#home">CHARMIN GREENE</a><p>© <span id="year">2026</span> CHARMIN GREENE · EDITORIAL WEBSITE PREVIEW</p></div><div><a href="#artist">THE ARTIST</a><a href="#experience">THE EXPERIENCE</a><a href="#booking">BOOKING</a></div></footer><script>document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('inquiry').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const fields=[['Name','name'],['Email','email'],['Event type','type'],['Event date','date'],['Location','location'],['Budget','budget'],['Details','details']];const msg='Charmin Greene — Booking Inquiry\n\n'+fields.map(([label,key])=>label+': '+(f.get(key)||'Not provided')).join('\n');const status=document.getElementById('status');try{await navigator.clipboard.writeText(msg);status.textContent='Your inquiry has been copied. Paste it into an email to the booking team or use the existing booking page.'}catch{status.textContent='Copy the details below and send them through the existing booking page.';const t=document.createElement('textarea');t.value=msg;t.readOnly=true;t.style.width='100%';t.style.height='190px';status.append(t)}});</script></body></html>
